name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm build
