name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with:
          cache: true
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
          - run: pnpm build
