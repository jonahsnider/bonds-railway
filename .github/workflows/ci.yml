name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3
        with:
          cache: true
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
          - run: pnpm build
